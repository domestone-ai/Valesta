name: Web app on GitHub Pages
# Each published release builds the web app (dist/Web), runs the unit tests and publishes it on GitHub Pages, so that
# Mac, iPhone, iPad and any computer with a browser can use Valesta. "Run workflow" publishes it again by hand.
# Two jobs: the deploy job starts when the artifact of the build job is complete and listed.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        run: python3 -I build.py
      - name: Unit tests
        run: for f in tests/*.test.js; do node --test "$f" || exit 1; done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/Web
  deploy:
    name: Publish the web app
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
