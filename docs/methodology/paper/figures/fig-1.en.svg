<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="fig-1-title fig-1-desc" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1A2229"><title id="fig-1-title">The steps of the method</title><desc id="fig-1-desc">Eight-step diagram: comparables, cleansing of prices, unit prices, homogenisation, weights, estimator, confidence interval of the estimate and market value; downstream, the analysis of the uncertainty due to judgement and the other approaches with the reconciliation.</desc><rect width="1000" height="392" fill="#FFFFFF"/><defs><marker id="fig-1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6670"/></marker></defs><rect x="10" y="20" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="35" cy="46" r="12" fill="#0B4F47"/><text x="35" y="51" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">1</text><text x="55" y="51" font-size="13" font-weight="600" fill="#12796B">§ 3.1</text><text x="26" y="74" font-size="17" font-weight="600">Comparables</text><text x="26" y="95" font-size="14" fill="#5A6670">prices, areas, dates,</text><text x="26" y="114" font-size="14" fill="#5A6670">sources and ratings</text><path d="M233,72 H257" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><rect x="263" y="20" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="288" cy="46" r="12" fill="#0B4F47"/><text x="288" y="51" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">2</text><text x="308" y="51" font-size="13" font-weight="600" fill="#12796B">§ 3.2</text><text x="468" y="51" text-anchor="end" font-size="13" fill="#5A6670">eq. (1)–(2)</text><text x="279" y="74" font-size="17" font-weight="600">Price cleansing</text><text x="279" y="95" font-size="14" fill="#5A6670">negotiation, time</text><text x="279" y="114" font-size="14" fill="#5A6670">and annexes</text><path d="M486,72 H510" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><rect x="516" y="20" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="541" cy="46" r="12" fill="#0B4F47"/><text x="541" y="51" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">3</text><text x="561" y="51" font-size="13" font-weight="600" fill="#12796B">§ 3.3</text><text x="721" y="51" text-anchor="end" font-size="13" fill="#5A6670">eq. (3)</text><text x="532" y="74" font-size="17" font-weight="600">Unit prices</text><text x="532" y="95" font-size="14" fill="#5A6670">on the chosen</text><text x="532" y="114" font-size="14" fill="#5A6670">area basis</text><path d="M739,72 H763" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><rect x="769" y="20" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="794" cy="46" r="12" fill="#0B4F47"/><text x="794" y="51" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">4</text><text x="814" y="51" font-size="13" font-weight="600" fill="#12796B">§ 3.4</text><text x="974" y="51" text-anchor="end" font-size="13" fill="#5A6670">eq. (4)–(5)</text><text x="785" y="74" font-size="17" font-weight="600">Homogenisation</text><text x="785" y="95" font-size="14" fill="#5A6670">coefficients on a</text><text x="785" y="114" font-size="14" fill="#5A6670">five-level scale</text><rect x="10" y="166" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="35" cy="192" r="12" fill="#0B4F47"/><text x="35" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">5</text><text x="55" y="197" font-size="13" font-weight="600" fill="#12796B">§ 3.5</text><text x="215" y="197" text-anchor="end" font-size="13" fill="#5A6670">eq. (6)</text><text x="26" y="220" font-size="17" font-weight="600">Weights</text><text x="26" y="241" font-size="14" fill="#5A6670">source reliability</text><text x="26" y="260" font-size="14" fill="#5A6670">and similarity</text><path d="M233,218 H257" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><rect x="263" y="166" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="288" cy="192" r="12" fill="#0B4F47"/><text x="288" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">6</text><text x="308" y="197" font-size="13" font-weight="600" fill="#12796B">§ 3.6</text><text x="468" y="197" text-anchor="end" font-size="13" fill="#5A6670">eq. (7)</text><text x="279" y="220" font-size="17" font-weight="600">Estimator</text><text x="279" y="241" font-size="14" fill="#5A6670">weighted mean or one of</text><text x="279" y="260" font-size="14" fill="#5A6670">three other estimators</text><path d="M486,218 H510" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><rect x="516" y="166" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="541" cy="192" r="12" fill="#0B4F47"/><text x="541" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">7</text><text x="561" y="197" font-size="13" font-weight="600" fill="#12796B">§ 3.7</text><text x="721" y="197" text-anchor="end" font-size="13" fill="#5A6670">eq. (8)–(10)</text><text x="532" y="220" font-size="17" font-weight="600">Confidence</text><text x="532" y="240" font-size="17" font-weight="600">interval</text><text x="532" y="261" font-size="14" fill="#5A6670">of the estimate</text><path d="M739,218 H763" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><rect x="769" y="166" width="219" height="104" rx="8" fill="#F0F6F5" stroke="#E2EFEC" stroke-width="1.5"/><circle cx="794" cy="192" r="12" fill="#0B4F47"/><text x="794" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">8</text><text x="814" y="197" font-size="13" font-weight="600" fill="#12796B">§ 3.8</text><text x="974" y="197" text-anchor="end" font-size="13" fill="#5A6670">eq. (12)</text><text x="785" y="220" font-size="17" font-weight="600">Market value</text><text x="785" y="241" font-size="14" fill="#5A6670">annexes, deductions</text><text x="785" y="260" font-size="14" fill="#5A6670">and rounding</text><path d="M878.5,126 V144 H119.5 V162" fill="none" stroke="#5A6670" stroke-width="1.6" marker-end="url(#fig-1-arrow)"/><path d="M878.5,272 V286 H252 V300" fill="none" stroke="#12796B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#fig-1-arrow)"/><path d="M746,286 V300" fill="none" stroke="#12796B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#fig-1-arrow)"/><rect x="10" y="304" width="484" height="78" rx="8" fill="#FFFFFF" stroke="#12796B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="28" y="330" font-size="16" font-weight="600" fill="#0B4F47">Uncertainty due to judgement</text><text x="28" y="352" font-size="14" fill="#5A6670">leave-one-out analysis (§ 4.1)</text><text x="28" y="370" font-size="14" fill="#5A6670">and Monte Carlo simulation (§ 4.2, eq. (13))</text><rect x="504" y="304" width="484" height="78" rx="8" fill="#FFFFFF" stroke="#12796B" stroke-width="1.5" stroke-dasharray="5 4"/><text x="522" y="330" font-size="16" font-weight="600" fill="#0B4F47">Other approaches and reconciliation</text><text x="522" y="352" font-size="14" fill="#5A6670">income, depreciated replacement cost,</text><text x="522" y="370" font-size="14" fill="#5A6670">residual; the valuer’s weights (§ 5)</text></svg>
