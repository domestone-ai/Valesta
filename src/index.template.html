<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Valesta · Property valuation</title>
<meta name="description" content="Valesta — professional property valuation with the sales comparison with homogenisation coefficients: A4 reports in 17 languages, agency profiles, AI assistant and MCP server.">
<meta name="application-name" content="Valesta">
<meta name="theme-color" content="#0B4F47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Valesta">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="@FAVICON@">
<script>/* theme chosen in the menu (light, dark, automatic), applied before drawing; see theme.js */try{var vt=localStorage.getItem('valesta-theme');document.documentElement.setAttribute('data-theme',vt==='dark'||(vt!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch(e){}</script>
<style id="css-fonts">/*@FONTS_CSS@*/
/*@FONTS_CJK_CSS@*/</style>
<style id="css-report">/*@REPORT_CSS@*/</style>
<style id="css-app">/*@APP_CSS@*/</style>
<style id="css-brand"></style>
</head>
<body class="ui2">
<div class="app" id="app">
  <header class="top">
    <a class="brand" href="#" data-action="go-home" id="brand-link"><span class="app-icon" id="app-icon"><!--@APP_ICON@--></span><span class="tb-name"><span class="sr-only">Valesta</span><!--@WORDMARK@--></span></a>
    <!-- header zones: navigation · the valuation (title, country · type · language) · state (value, quality) · tools · view · actions -->
    <div class="tb-doc"><nav class="crumbs" id="crumbs"></nav><div class="chips" id="chips"></div></div>
    <div class="tkpi-wrap" id="tb-kpi"></div>
    <span class="live-badge" id="live-badge" hidden>MCP</span>
    <button type="button" class="cmd tb-tip" id="cmd-btn" data-action="palette"><span class="cmd-ico" id="cmd-ico"></span><span class="cph" id="cmd-ph"></span><kbd>Ctrl K</kbd></button>
    <button type="button" class="btn tb-ai tb-tip" id="tb-ai" data-ctx="ai"><span class="ico" id="ai-ico"></span><span class="lbl" id="ai-lbl"></span></button>
    <button type="button" class="btn btn-icon tb-hist" id="b-undo" data-action="undo">↶</button>
    <button type="button" class="btn btn-icon tb-hist" id="b-redo" data-action="redo">↷</button>
    <button type="button" class="btn btn-icon ctx-toggle" id="ctx-toggle" data-action="ctx-toggle"></button>
    <div class="seg lay-seg" id="layout-seg" role="radiogroup" data-slide="thumb">
      <button type="button" role="radio" data-layout-mode="compile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span class="sr-only lbl"></span></button>
      <button type="button" role="radio" data-layout-mode="split"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg><span class="sr-only lbl"></span></button>
      <button type="button" role="radio" data-layout-mode="review"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M12 9h5M12 13h5M12 17h3"/></svg><span class="sr-only lbl"></span></button>
    </div>
    <button type="button" class="btn btn-primary tb-export" id="tb-export" data-action="goto-step" data-key="deliver"><span class="ico" id="export-ico"></span><span class="lbl" id="export-lbl"></span></button>
    <button type="button" class="btn btn-icon" id="menu-btn" data-action="menu" aria-haspopup="true" aria-expanded="false">⋯</button>
  </header>
  <div class="menu" id="menu" role="menu">
    <div class="menu-sec"><div class="menu-t" id="menu-title-file"></div>
      <button type="button" data-action="new"><span class="mi">＋</span><span class="lbl"></span></button>
      <button type="button" data-action="open"><span class="mi">⤒</span><span class="lbl"></span></button>
      <button type="button" data-action="save"><span class="mi">⤓</span><span class="lbl"></span></button>
      <button type="button" data-action="archive"><span class="mi">☰</span><span class="lbl"></span></button>
      <button type="button" data-action="export-html"><span class="mi">&lt;/&gt;</span><span class="lbl"></span></button>
      <button type="button" data-action="print"><span class="mi">⎙</span><span class="lbl"></span></button>
      <button type="button" data-action="share" id="m-share" hidden><span class="mi">↗</span><span class="lbl"></span></button>
      <button type="button" data-action="privacy"><span class="mi">◎</span><span class="lbl"></span></button>
    </div>
    <div class="menu-sec"><div class="menu-t" id="menu-title-profile"></div>
      <button type="button" data-action="profile-export"><span class="mi">⤓</span><span class="lbl"></span></button>
      <button type="button" data-action="profile-import"><span class="mi">⤒</span><span class="lbl"></span></button>
    </div>
    <div class="menu-sec"><div class="menu-t" id="menu-title-lang"></div>
      <button type="button" class="lang-pick lang-pick--both" data-action="pop-lang" data-key="both" aria-haspopup="listbox"><span class="cc"></span><span class="lbl"></span><span class="caret" aria-hidden="true">▾</span></button>
      <p class="menu-hint" id="menu-lang-hint"></p>
      <div class="lang-row"><span id="menu-title-ui"></span><button type="button" class="lang-pick" data-action="pop-lang" data-key="ui" aria-haspopup="listbox"><span class="cc"></span><span class="lbl"></span><span class="caret" aria-hidden="true">▾</span></button></div>
      <div class="lang-row"><span id="menu-title-report"></span><button type="button" class="lang-pick" data-action="pop-lang" data-key="report" aria-haspopup="listbox"><span class="cc"></span><span class="lbl"></span><span class="caret" aria-hidden="true">▾</span></button></div>
    </div>
    <div class="menu-sec"><div class="menu-t" id="menu-title-view"></div>
      <div class="seg seg-theme" id="theme-seg" role="radiogroup" data-slide="thumb">
        <button type="button" role="radio" data-theme-choice="light"><span class="lbl"></span></button>
        <button type="button" role="radio" data-theme-choice="dark"><span class="lbl"></span></button>
        <button type="button" role="radio" data-theme-choice="auto"><span class="lbl"></span></button>
      </div>
      <button type="button" data-action="layout-reset" class="lay-reset"><span class="mi">↺</span><span class="lbl"></span></button>
    </div>
    <div class="menu-sec"><div class="menu-t" id="menu-title-help"></div>
      <button type="button" data-action="support"><span class="mi">☆</span><span class="lbl"></span></button>
      <button type="button" data-action="feedback"><span class="mi">✎</span><span class="lbl"></span></button>
    </div>
    <div class="menu-foot">Valesta · <span id="menu-version"></span><br>IVS 2025 · RICS · EVS</div>
  </div>
  <aside class="vside" id="side"></aside>
  <main class="main" id="main"><div class="main-in" id="tab-body"></div><div class="sup-slot" id="support-slot"></div></main>
  <div class="resizer" id="ctx-resizer" role="separator" aria-orientation="vertical" aria-controls="ctx" tabindex="0"></div>
  <aside class="ctx" id="ctx">
    <div class="ctx-tabs" role="tablist" id="ctx-tabs" data-slide="ink">
      <button type="button" role="tab" data-ctx="preview" id="ctx-t-preview"></button>
      <button type="button" role="tab" data-ctx="ai" id="ctx-t-ai"></button>
      <button type="button" role="tab" data-ctx="issues" id="ctx-t-issues"></button>
      <button type="button" class="btn btn-icon btn-sm ctx-close" id="ctx-close" data-action="ctx-toggle">✕</button>
    </div>
    <section class="pane pane-preview" id="preview-pane" role="tabpanel">
      <div class="pv-toolbar">
        <button type="button" class="btn btn-sm btn-icon" data-action="zoom-out">−</button>
        <button type="button" class="btn btn-sm pv-zoom" data-action="zoom-fit" id="zoom-label"></button>
        <button type="button" class="btn btn-sm btn-icon" data-action="zoom-in">+</button>
        <span class="seg pv-fitg" data-slide="thumb"><button type="button" class="tb-tip" data-action="zoom-fit" id="pv-fitw"></button><button type="button" class="tb-tip" data-action="zoom-page" id="pv-fitp"></button></span>
        <button type="button" class="btn btn-sm btn-icon tb-tip" data-action="pv-chapters" id="pv-chap" aria-haspopup="listbox"></button>
        <span class="sp"></span>
        <span class="ovf" id="pv-ovf"></span>
        <span class="fitinfo" id="pv-fit"></span>
        <span class="info" id="pv-info"></span>
        <button type="button" class="btn btn-sm btn-icon tb-tip" data-action="pv-follow" id="pv-follow"></button>
        <button type="button" class="btn btn-sm btn-icon tb-tip" data-action="preview-full" id="pv-full"></button>
      </div>
      <div class="pv-scroll" id="pv-scroll"><div class="report zoomed" id="report" role="document"></div></div>
    </section>
    <section class="pane pane-ai" id="pane-ai" role="tabpanel" hidden><div class="aiq" id="ai-queue" hidden></div><aside class="ai-panel" id="ai-panel" aria-hidden="true"></aside></section>
    <section class="pane pane-issues" id="pane-issues" role="tabpanel" hidden></section>
  </aside>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<div class="overlay" id="palette" hidden>
  <div class="pal" role="dialog" aria-modal="true" id="pal-dlg">
    <div class="pal-in"><span id="pal-ico"></span><input id="pal-input" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="pal-list" aria-autocomplete="list"></div>
    <div class="pal-list" id="pal-list" role="listbox"></div>
    <div class="pal-foot" id="pal-foot"></div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>
<dialog class="dlg" id="dlg"></dialog>
<input type="file" id="file-open" accept=".json,application/json" hidden>
<input type="file" id="file-photos" accept="image/*" multiple hidden>
<input type="file" id="file-logo" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>
<input type="file" id="file-profile" accept=".json,application/json" hidden>
<input type="file" id="file-att" accept="application/pdf,image/jpeg,image/png,image/webp" multiple hidden>
<input type="file" id="file-ai" accept="image/*,.pdf,.txt,.md,.csv,.tsv,.json,.xml,.html,.htm,.eml,.docx" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
